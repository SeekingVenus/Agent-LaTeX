[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["agent-latex contributors"]

[workspace.dependencies]
latex-core = { path = "crates/latex-core" }
latex-layout = { path = "crates/latex-layout" }
latex-term = { path = "crates/latex-term" }
latex-stream = { path = "crates/latex-stream" }
latex-pty = { path = "crates/latex-pty" }
latex-markdown = { path = "crates/latex-markdown" }

unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
libc = "0.2"
terminal_size = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
