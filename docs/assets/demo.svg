<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="426" viewBox="0 0 1000 426" role="img" aria-labelledby="title desc">
<title id="title">agent-latex rendering examples</title>
<desc id="desc">Actual terminal output for a Gaussian integral, scaled dot-product attention, cross-entropy loss and a covariance matrix.</desc>
<rect width="1000" height="426" fill="#171717"/>
<text x="32" y="33" font-family="monospace" font-size="14" fill="#a0a0a0">$ agent-latex demo</text>
<path d="M32 52 H968 M32 228 H968 M500 70 V402" fill="none" stroke="#333333"/>
